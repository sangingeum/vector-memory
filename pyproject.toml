[project]
name = "vector-memory"
version = "0.1.0"
description = "MCP server: Ollama embeddings + Qdrant vector memory"
readme = "README.md"
authors = [
    { name = "sangingeum", email = "sangingeum@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp[cli]<2",
    "numpy<2; python_version < '3.13'",
    "numpy>=2; python_version >= '3.13'",
    "ollama>=0.6.2",
    "qdrant-client>=1.15,<2",
    "typer>=0.12",
]

[project.scripts]
vector-memory = "vector_memory.cli:main"
vector-memory-mcp = "vector_memory.server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "live: tests that need the real Ollama/Qdrant backends (deselect with -m \"not live\")",
]
# Warn-clean bar: any warning becomes an error so regressions cannot hide.
filterwarnings = ["error"]
